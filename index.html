<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>مساعد زياد</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Arabic:wght@500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ============ شاشة الترحيب ============ -->
<section id="view-welcome" class="view view--active">
  <div class="orb" aria-hidden="true"></div>
  <div class="welcome-card">
    <p class="eyebrow" id="welcome-eyebrow">أهلاً</p>
    <h1 id="welcome-title">مساعد زياد</h1>
    <p class="welcome-text" id="welcome-text">
      مصمم بهدوء عشان يسمعك، ويتكلم معاكي براحة، وباحترام.
    </p>
    <div class="welcome-actions">
      <button class="btn btn--primary" id="btn-mother-enter">أنا سماح، هدخل أتكلم</button>
      <button class="btn btn--ghost" id="btn-owner-enter">دخول زياد</button>
    </div>
  </div>
</section>

<!-- ============ شاشة الدخول ============ -->
<section id="view-auth" class="view">
  <div class="auth-card">
    <button class="link-back" id="auth-back">‹ رجوع</button>
    <h2 id="auth-heading">تسجيل الدخول</h2>
    <form id="auth-form">
      <label>البريد الإلكتروني
        <input type="email" id="auth-email" required autocomplete="email" />
      </label>
      <label>كلمة المرور
        <input type="password" id="auth-password" required autocomplete="current-password" minlength="6" />
      </label>
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" class="btn btn--primary" id="auth-submit">دخول</button>
    </form>
    <button class="link-toggle" id="auth-toggle-mode">لسه معندكيش حساب؟ سجّلي دلوقتي</button>
    <div class="divider"><span>أو</span></div>
    <button class="btn btn--google" id="auth-google">
      <span>الدخول بحساب Google</span>
    </button>
  </div>
</section>

<!-- ============ التطبيق الرئيسي ============ -->
<section id="view-app" class="view">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <button class="btn btn--primary btn--block" id="new-chat-btn">+ محادثة جديدة</button>
      <input type="search" id="chat-search" placeholder="بحث في المحادثات..." />
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div class="sidebar-bottom">
      <button id="open-settings" class="sidebar-link">⚙ الإعدادات</button>
      <button id="logout-btn" class="sidebar-link">خروج</button>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <button id="toggle-sidebar" class="icon-btn" aria-label="القائمة">☰</button>
      <h2 id="chat-title">محادثة جديدة</h2>
    </header>

    <div id="messages" class="messages">
      <div class="empty-state" id="empty-state">
        <p>ابدئي بأي كلمة، أنا موجود.</p>
      </div>
    </div>

    <div class="typing-indicator" id="typing-indicator" hidden>
      <span></span><span></span><span></span>
    </div>

    <form id="composer" class="composer">
      <textarea id="composer-input" placeholder="اكتب رسالتك..." rows="1"></textarea>
      <button type="submit" class="send-btn" id="send-btn" aria-label="إرسال">↑</button>
    </form>
  </main>

  <!-- لوحة الإعدادات -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-card">
      <button class="link-back" id="settings-close">‹ رجوع</button>
      <h2>الإعدادات</h2>

      <div class="settings-row">
        <label for="setting-memory">تفعيل الذاكرة الدائمة</label>
        <input type="checkbox" id="setting-memory" checked />
      </div>

      <div class="settings-row settings-row--col">
        <label>أسلوب الرد</label>
        <select id="setting-style">
          <option value="calm">هادئ ومختصر</option>
          <option value="warm">دافئ وتفصيلي</option>
          <option value="direct">مباشر وعملي</option>
        </select>
      </div>

      <div class="settings-row settings-row--col">
        <p class="settings-hint">الحقائق المحفوظة عنك في الذاكرة الطويلة:</p>
        <ul id="memory-facts-list" class="memory-facts"></ul>
      </div>
    </div>
  </div>
</section>

<script type="module" src="/js/app.js"></script>
</body>
</html>
